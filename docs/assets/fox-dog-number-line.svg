<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">A fox approaches a sleeping shaggy sheepdog, jumps over it, and repeats in both directions</title>
  <desc id="desc">An animated fox walks with its feet on a numbered line. When it first spots a shaggy sleeping sheepdog at position three, a red exclamation mark appears above its head. The fox jumps over the dog, lands at position four, walks to the end, turns around, and repeats the sequence in reverse.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b2d"/><stop offset="1" stop-color="#1b2d40"/></linearGradient>
    <linearGradient id="foxFur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc56f"/><stop offset="1" stop-color="#e96d35"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .tick-label { fill:#c7d2df; font-size:14px; text-anchor:middle; }
      .state { font-size:14px; font-weight:700; }
      .alert { animation: alertFlash 18s linear infinite; }
      .zzz { transform-box: fill-box; transform-origin: center; animation: sleepy 1.8s ease-in-out infinite; }
      @keyframes sleepy { 0%,100% { transform:translate(0,0) rotate(-5deg); } 50% { transform:translate(7px,-9px) rotate(6deg); } }
      .walk-label { animation: walkState 18s linear infinite; }
      .jump-label { animation: jumpState 18s linear infinite; }
      @keyframes alertFlash {
        0%, 6.6% { opacity:0; transform:translateY(7px) scale(.65); }
        7%, 8.5% { opacity:1; transform:translateY(0) scale(1); }
        9%, 100% { opacity:0; transform:translateY(7px) scale(.65); }
      }
      @keyframes walkState {
        0%, 8.9% { opacity:1; } 9%, 25% { opacity:0; } 25.1%,100% { opacity:1; }
      }
      @keyframes jumpState {
        0%,8.9% { opacity:0; } 9%,25% { opacity:1; } 25.1%,100% { opacity:0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .alert,.walk-label,.jump-label,.zzz { animation:none; }
        .alert { opacity:0; }
        .walk-label { opacity:1; }
        .jump-label { opacity:0; }
      }
    </style>
  </defs>
  <rect width="1000" height="330" rx="20" fill="url(#bg)"/>
  <circle cx="120" cy="65" r="45" fill="#e8f2ff" opacity=".06" filter="url(#soft)"/>
  <text x="36" y="37" fill="#eaf2fb" font-size="17" font-weight="700" letter-spacing="1.2">ONE FOX · ONE SLEEPING SHEEPDOG · EXPLICIT BEHAVIOR</text>
  <text x="36" y="61" fill="#9fb3c8" font-size="13">Walk → spot → jump → land → turn around → repeat.</text>
  <rect x="36" y="78" width="244" height="34" rx="17" fill="#213e51" stroke="#426277"/>
  <circle cx="54" cy="95" r="4" fill="#74d6b3"/>
  <text x="67" y="100" fill="#ccefe4" font-size="12" font-weight="700">ILLUSTRATIVE FSM STATE</text>
  <text class="state walk-label" x="218" y="100" fill="#74d6b3" text-anchor="middle">Walking</text>
  <text class="state jump-label" x="218" y="100" fill="#ffcf86" text-anchor="middle">Jumping</text>
  <rect x="738" y="78" width="226" height="60" rx="12" fill="#22364a" stroke="#3d5268"/>
  <text x="755" y="100" fill="#91a8bf" font-size="11" letter-spacing=".8">SLEEPING SHEEPDOG</text>
  <text x="755" y="122" fill="#edf3fa" font-size="15" font-weight="700">Position 3 · still snoozing</text>
  <path d="M100 221 H900" stroke="#91a6bb" stroke-width="10" stroke-linecap="round" opacity=".14"/>
  <path d="M100 221 H900" stroke="#91a6bb" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#91a6bb" stroke-width="2">
    <path d="M100 211v20 M180 211v20 M260 211v20 M340 211v20 M420 211v20 M500 211v20 M580 211v20 M660 211v20 M740 211v20 M820 211v20 M900 211v20"/>
  </g>
  <g class="tick-label">
    <text x="100" y="251">0</text><text x="180" y="251">1</text><text x="260" y="251">2</text><text x="340" y="251">3</text><text x="420" y="251">4</text><text x="500" y="251">5</text><text x="580" y="251">6</text><text x="660" y="251">7</text><text x="740" y="251">8</text><text x="820" y="251">9</text><text x="900" y="251">10</text>
  </g>
  <text x="100" y="273" fill="#8da4ba" font-size="12" text-anchor="middle">START</text>
  <text x="340" y="273" fill="#8da4ba" font-size="12" text-anchor="middle">SHEEPDOG</text>
  <text x="420" y="273" fill="#8da4ba" font-size="12" text-anchor="middle">LANDS AT 4</text>
  <!-- A large, shaggy sheepdog: a friendly nod to classic cartoon sheepdogs, not a traced character. -->
  <!-- Original shaggy sheepdog: broad body, floppy ears, long muzzle, collar, and sleepy face. -->
  <g transform="translate(340 180)">
    <ellipse cx="0" cy="41" rx="52" ry="7" fill="#07111d" opacity=".45"/>
    <path d="M-45 4 Q-54 -8 -44 -20 Q-38 -31 -25 -25 Q-10 -32 0 -24 Q18 -31 29 -18 Q43 -15 43 0 L35 26 L-34 29Z" fill="#d8d5cc" stroke="#929fa6" stroke-width="2"/>
    <ellipse cx="-3" cy="15" rx="40" ry="22" fill="#eee9de" stroke="#aab0b2" stroke-width="2"/>
    <path d="M-31 6 Q-40 -2 -30 -12 Q-17 -18 -9 -7 Q2 -17 12 -7 Q25 -14 31 -2 L24 12 Q4 24 -20 19Z" fill="#faf3e7"/>
    <path d="M-29 29 L-31 38 M-9 31 L-10 39 M15 31 L17 39 M31 26 L36 38" stroke="#e5dfd2" stroke-width="9" stroke-linecap="round"/>
    <path d="M-39 -1 Q-55 -8 -55 -26 Q-53 -42 -42 -36 Q-28 -28 -32 -8Z" fill="#a6a39a" stroke="#7e898e" stroke-width="2"/>
    <path d="M19 -10 Q31 -24 42 -14 Q50 -3 38 8 L23 7Z" fill="#d0ccc2" stroke="#929fa6" stroke-width="2"/>
    <path d="M21 4 Q34 -2 47 6 Q57 13 48 22 Q36 28 21 19Z" fill="#f3ecdf" stroke="#aab0b2" stroke-width="2"/>
    <path d="M28 7 Q34 2 39 7 M39 8 Q44 3 48 9" fill="none" stroke="#6d625a" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="48" cy="14" rx="6" ry="4" fill="#394a58"/>
    <path d="M42 20 Q48 24 53 19" fill="none" stroke="#76695d" stroke-width="2" stroke-linecap="round"/>
    <path d="M-30 19 Q-18 27 -4 22" fill="none" stroke="#a93f4b" stroke-width="7" stroke-linecap="round"/>
    <path d="M-4 19 L3 23 L-3 29 L-10 24Z" fill="#e4c66b" stroke="#8b783c" stroke-width="1.5"/>
    <g class="zzz" fill="#c5d7e8" font-weight="700"><text x="50" y="-25" font-size="15">Z</text><text x="66" y="-37" font-size="11">z</text><text x="77" y="-45" font-size="9">z</text></g>
  </g>
  <!-- Fox stays on the number line; the same motion path carries it out and back, with auto-rotation on the return. -->
  <g transform="translate(100 181)">
    <animateMotion dur="18s" repeatCount="indefinite" rotate="auto" path="M 0,0 L 150,0 L 150,0 Q 235,-112 320,0 L 800,0 L 800,0 L 320,0 Q 235,-112 150,0 L 0,0"/>
    <ellipse cx="2" cy="40" rx="29" ry="6" fill="#07111d" opacity=".45"/>
    <path d="M-12 23 Q-45 18 -39 0 Q-34 -13 -20 -3 Q-34 2 -21 10 Q-8 16 1 19" fill="#f7eee0" stroke="#dc8545" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-12 23 Q-31 17 -29 5 Q-24 2 -19 10 Q-11 16 1 19" fill="#f6f0e6"/>
    <ellipse cx="2" cy="21" rx="24" ry="15" fill="url(#foxFur)"/>
    <path d="M-10 28 L-13 39 M14 29 L17 39" stroke="#f4b46b" stroke-width="6" stroke-linecap="round"/>
    <path d="M-18 17 Q-13 6 -3 10 L14 14 L10 28 Q-2 34 -14 25Z" fill="#f8e8d1"/>
    <path d="M9 10 L18 -8 L35 -14 L44 -3 L34 13 L20 19Z" fill="url(#foxFur)" stroke="#d96832" stroke-width="2" stroke-linejoin="round"/>
    <path d="M18 -7 L20 -23 L30 -12 M33 -12 L44 -22 L42 -4" fill="#ef8b43" stroke="#d96832" stroke-width="2" stroke-linejoin="round"/>
    <path d="M21 -5 L23 -17 L28 -10 M35 -12 L42 -18 L40 -7" fill="#f8e7cf"/>
    <path d="M30 4 Q37 7 42 1" fill="none" stroke="#6e3b29" stroke-width="2" stroke-linecap="round"/>
    <circle cx="32" cy="-5" r="2.4" fill="#182638"/>
    <path d="M-4 33 L-7 40 M20 31 L22 40" stroke="#f2d6b5" stroke-width="4" stroke-linecap="round"/>
    <g class="alert" transform="translate(36 -47)">
      <path d="M-3 -15 Q-3 -21 3 -21 Q9 -21 8 -15 L5 -2 Q4 2 1 2 Q-2 2 -2 -2Z" fill="#ff3b4f" stroke="#fff1d8" stroke-width="1.5"/>
      <circle cx="2" cy="9" r="3.5" fill="#ff3b4f" stroke="#fff1d8" stroke-width="1.5"/>
    </g>
  </g>
  <text x="36" y="306" fill="#7f98b0" font-size="11">Concept animation only · the C# FSM remains the source of actual demo behavior.</text>
</svg>