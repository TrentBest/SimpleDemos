<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Many foxes and dogs in a shared two-dimensional world</title>
  <desc id="desc">A stylized grid shows foxes and dogs at different positions, with dashed lines indicating example sight or interaction ranges. The advanced simulation uses shared environment sensing, visibility, and collision checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b2d"/><stop offset="1" stop-color="#1b2d40"/></linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#456079" stroke-width="1" opacity=".58"/></pattern>
  </defs>
  <rect width="1000" height="360" rx="20" fill="url(#bg)"/>
  <text x="36" y="38" fill="#eaf2fb" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700" letter-spacing="1.3">SCALE THE SAME IDEA</text>
  <text x="36" y="62" fill="#9fb3c8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">More agents · one shared world · each agent still has its own state.</text>
  <rect x="36" y="83" width="670" height="240" rx="10" fill="#142438" stroke="#3b536b"/>
  <rect x="36" y="83" width="670" height="240" rx="10" fill="url(#grid)"/>
  <g fill="none" stroke-width="2" stroke-dasharray="5 6" opacity=".8">
    <circle cx="190" cy="155" r="78" stroke="#f6a65b"/>
    <circle cx="430" cy="238" r="75" stroke="#74d6b3"/>
    <circle cx="560" cy="140" r="72" stroke="#f6a65b"/>
  </g>
  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="27" text-anchor="middle">
    <text x="150" y="143">🦊</text><text x="280" y="230">🦊</text><text x="435" y="226">🦊</text><text x="580" y="138">🦊</text><text x="620" y="278">🦊</text>
    <text x="250" y="113">🐕</text><text x="493" y="147">🐕</text><text x="380" y="290">🐕</text>
  </g>
  <g fill="#dce7f2" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">
    <text x="737" y="111" font-weight="700" letter-spacing="1">ADVANCED SOURCE</text>
    <text x="737" y="141">100 × 100 world</text>
    <text x="737" y="164">15 foxes · 5 dogs</text>
    <path d="M737 183H957" stroke="#3b536b"/>
    <text x="737" y="207" fill="#f6b36e" font-weight="700">Environment</text><text x="737" y="225" fill="#9fb3c8">Visibility + collisions</text>
    <text x="737" y="254" fill="#74d6b3" font-weight="700">Dogs → Foxes</text><text x="737" y="272" fill="#9fb3c8">Sensing and behavior updates</text>
    <text x="737" y="307" fill="#7f98b0" font-size="11">Schematic, not a live simulation.</text>
  </g>
</svg>