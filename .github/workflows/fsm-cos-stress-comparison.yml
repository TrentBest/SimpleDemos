name: FSM_COS stress comparison validation

on:
  push:
    branches: [development]
    paths:
      - 'Stress/**'
      - 'QuickBrownFox/**'
      - 'docs/FSM_COS_STRESS_BENCHMARK.md'
      - '.github/workflows/fsm-cos-stress-comparison.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'Stress/**'
      - '.github/workflows/fsm-cos-stress-comparison.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fsm-cos-stress-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SimpleDemos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: SimpleDemos
          persist-credentials: false

      - name: Checkout FSM_COS source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TrentBest/TheSingularityWorkshop.FSM_COS
          ref: development
          path: TheSingularityWorkshop.FSM_COS
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Restore comparison runner
        working-directory: SimpleDemos
        run: dotnet restore Stress/FSM_COS/Stress.FSM_COS.csproj

      - name: Build comparison runner
        working-directory: SimpleDemos
        run: dotnet build Stress/FSM_COS/Stress.FSM_COS.csproj --configuration Release --no-restore

      - name: Restore fox-and-dog FSM_COS runner
        working-directory: SimpleDemos
        run: dotnet restore QuickBrownFox/FSM_COS/QuickBrownFox.FSM_COS.csproj

      - name: Build fox-and-dog FSM_COS runner
        working-directory: SimpleDemos
        run: dotnet build QuickBrownFox/FSM_COS/QuickBrownFox.FSM_COS.csproj --configuration Release --no-restore

      - name: Export direct FSM_API fox-and-dog trace
        working-directory: SimpleDemos
        run: dotnet run --project QuickBrownFox/QuickBrownFox.csproj --configuration Release --no-build -- --export-trace fox-dog-direct-trace.json

      - name: Export FSM_COS-composed fox-and-dog trace
        working-directory: SimpleDemos
        run: dotnet run --project QuickBrownFox/FSM_COS/QuickBrownFox.FSM_COS.csproj --configuration Release --no-build -- fox-dog-fsm-cos-trace.json

      - name: Verify direct and composed fox-and-dog behavior is identical
        working-directory: SimpleDemos
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open("fox-dog-direct-trace.json", encoding="utf-8") as stream:
              direct = json.load(stream)
          with open("fox-dog-fsm-cos-trace.json", encoding="utf-8") as stream:
              composed = json.load(stream)

          direct_frames = direct.get("frames", [])
          composed_frames = composed.get("frames", [])
          if not direct_frames or direct_frames != composed_frames:
              print(f"Trace mismatch: direct={len(direct_frames)} frames, FSM_COS={len(composed_frames)} frames")
              for index, (left, right) in enumerate(zip(direct_frames, composed_frames)):
                  if left != right:
                      print(f"First differing frame {index}: direct={left!r}; FSM_COS={right!r}")
                      break
              sys.exit(1)

          print(f"PASS: direct FSM_API and FSM_COS-composed demo produced {len(direct_frames)} identical observable frames.")
          PY

      - name: Upload direct and composed fox-and-dog trace evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fsm-cos-fox-dog-trace-comparison-${{ github.run_id }}
          path: |
            SimpleDemos/fox-dog-direct-trace.json
            SimpleDemos/fox-dog-fsm-cos-trace.json
          if-no-files-found: error
          retention-days: 14

      - name: Restore advanced fox-and-dog FSM_COS runner
        working-directory: SimpleDemos
        run: dotnet restore QuickBrownFox/FSM_COS/Advanced/Advanced.FSM_COS.csproj

      - name: Build advanced fox-and-dog FSM_COS runner
        working-directory: SimpleDemos
        run: dotnet build QuickBrownFox/FSM_COS/Advanced/Advanced.FSM_COS.csproj --configuration Release --no-restore

      - name: Export direct advanced 2D FSM_API trace
        working-directory: SimpleDemos
        run: dotnet run --project QuickBrownFox/QuickBrownFox.csproj --configuration Release --no-build -- --export-advanced-trace advanced-fox-dog-direct-trace.json

      - name: Export FSM_COS-composed advanced 2D trace
        working-directory: SimpleDemos
        run: dotnet run --project QuickBrownFox/FSM_COS/Advanced/Advanced.FSM_COS.csproj --configuration Release --no-build -- advanced-fox-dog-fsm-cos-trace.json

      - name: Verify direct and composed advanced 2D behavior is identical
        working-directory: SimpleDemos
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open("advanced-fox-dog-direct-trace.json", encoding="utf-8") as stream:
              direct = json.load(stream)
          with open("advanced-fox-dog-fsm-cos-trace.json", encoding="utf-8") as stream:
              composed = json.load(stream)

          direct_frames = direct.get("frames", [])
          composed_frames = composed.get("frames", [])
          if not direct_frames or direct_frames != composed_frames:
              print(f"Advanced trace mismatch: direct={len(direct_frames)} frames, FSM_COS={len(composed_frames)} frames")
              for index, (left, right) in enumerate(zip(direct_frames, composed_frames)):
                  if left != right:
                      print(f"First differing frame {index}: direct={left!r}; FSM_COS={right!r}")
                      break
              sys.exit(1)

          print(f"PASS: direct FSM_API and FSM_COS-composed advanced simulation produced {len(direct_frames)} identical observable frames.")
          PY

      - name: Upload direct and composed advanced fox-and-dog trace evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fsm-cos-advanced-fox-dog-trace-comparison-${{ github.run_id }}
          path: |
            SimpleDemos/advanced-fox-dog-direct-trace.json
            SimpleDemos/advanced-fox-dog-fsm-cos-trace.json
          if-no-files-found: error
          retention-days: 14

      - name: Execute comparison smoke run
        working-directory: SimpleDemos
        run: dotnet run --project Stress/FSM_COS/Stress.FSM_COS.csproj --configuration Release --no-build

      - name: Upload raw smoke-run output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fsm-cos-stress-comparison-smoke-${{ github.run_id }}
          path: SimpleDemos/fsm_cos_stress_comparison.csv
          if-no-files-found: error
          retention-days: 14
