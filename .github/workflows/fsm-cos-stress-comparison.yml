name: FSM_COS stress comparison validation

on:
  push:
    branches: [development]
    paths:
      - 'Stress/**'
      - '.github/workflows/fsm-cos-stress-comparison.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'Stress/**'
      - '.github/workflows/fsm-cos-stress-comparison.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fsm-cos-stress-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SimpleDemos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: SimpleDemos
          persist-credentials: false

      - name: Checkout FSM_COS source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TrentBest/TheSingularityWorkshop.FSM_COS
          ref: development
          path: TheSingularityWorkshop.FSM_COS
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Restore comparison runner
        working-directory: SimpleDemos
        run: dotnet restore Stress/FSM_COS/Stress.FSM_COS.csproj

      - name: Build comparison runner
        working-directory: SimpleDemos
        run: dotnet build Stress/FSM_COS/Stress.FSM_COS.csproj --configuration Release --no-restore

      - name: Execute comparison smoke run
        working-directory: SimpleDemos
        run: dotnet run --project Stress/FSM_COS/Stress.FSM_COS.csproj --configuration Release --no-build

      - name: Upload raw smoke-run output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fsm-cos-stress-comparison-smoke-${{ github.run_id }}
          path: SimpleDemos/fsm_cos_stress_comparison.csv
          if-no-files-found: error
          retention-days: 14
