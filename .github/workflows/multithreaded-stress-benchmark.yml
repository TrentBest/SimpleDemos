name: MultiThreadedStress Benchmark

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/multithreaded-stress-benchmark.yml'
      - 'MultiThreadedStress/**'
  workflow_dispatch:
    inputs:
      trials:
        description: "Measured trials per worker count (1-25)"
        required: true
        default: "7"
        type: string

permissions:
  contents: read

concurrency:
  group: multithreaded-stress-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Fixed-workload scaling (workers=${{ matrix.workers }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2, 4, 8]
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MultiThreadedStress/MultiThreadedStress.csproj

      - name: Build
        run: dotnet build MultiThreadedStress/MultiThreadedStress.csproj --configuration Release --no-restore

      - name: Run benchmark
        shell: bash
        env:
          WORKERS: ${{ matrix.workers }}
          TOTAL_CALLBACKS: 40000
          TRIALS: ${{ inputs.trials || '7' }}
        run: |
          set -euo pipefail
          if (( TOTAL_CALLBACKS % WORKERS != 0 )); then
            echo "TOTAL_CALLBACKS must divide evenly by WORKERS" >&2
            exit 2
          fi
          ITERATIONS=$((TOTAL_CALLBACKS / WORKERS))
          echo "Fixed workload: $TOTAL_CALLBACKS callbacks; workers=$WORKERS; iterations per worker=$ITERATIONS; trials=$TRIALS"
          dotnet run --project MultiThreadedStress/MultiThreadedStress.csproj --configuration Release --no-build -- \
            --workers "$WORKERS" \
            --iterations "$ITERATIONS" \
            --trials "$TRIALS" | tee multithreaded_stress_run.log

      - name: Upload raw CSV and console summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multithreaded-stress-${{ github.run_id }}-workers-${{ matrix.workers }}
          path: |
            multithreaded_stress.csv
            multithreaded_stress_run.log
          if-no-files-found: error
          retention-days: 14
