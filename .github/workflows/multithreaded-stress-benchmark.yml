name: MultiThreadedStress Benchmark

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Worker count (1-64)"
        required: true
        default: "4"
        type: string
      iterations:
        description: "Iterations per worker (1-1000000)"
        required: true
        default: "10000"
        type: string
      trials:
        description: "Measured trials (1-25)"
        required: true
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: multithreaded-stress-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Run named stress scenarios and retain raw results
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MultiThreadedStress/MultiThreadedStress.csproj

      - name: Build
        run: dotnet build MultiThreadedStress/MultiThreadedStress.csproj --configuration Release --no-restore

      - name: Run benchmark
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project MultiThreadedStress/MultiThreadedStress.csproj --configuration Release --no-build -- \
            --workers "${{ inputs.workers }}" \
            --iterations "${{ inputs.iterations }}" \
            --trials "${{ inputs.trials }}" | tee multithreaded_stress_run.log

      - name: Upload raw CSV and console summary
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce # v4
        with:
          name: multithreaded-stress-${{ github.run_id }}
          path: |
            multithreaded_stress.csv
            multithreaded_stress_run.log
          if-no-files-found: error
          retention-days: 14
