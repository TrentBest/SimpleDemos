name: Sith Policy

on:
  push:
    branches:
      - "**"
  delete:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sith-policy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate permanent branch policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'delete' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0

      - name: Evaluate every repository branch and update the living badge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p assets
          branch_file="$(mktemp)"
          trap 'rm -f "$branch_file"' EXIT
          status="UNVERIFIED"
          branches=()
          branch_count="unknown"

          if gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name' > "$branch_file"; then
            mapfile -t branches < <(sort -u "$branch_file")
            branch_count="${#branches[@]}"
            if [[ "$branch_count" -eq 2 &&
                  "${branches[0]}" == "development" &&
                  "${branches[1]}" == "master" ]]; then
              status="COMPLIANT"
            else
              status="NON-COMPLIANT"
            fi
          fi

          case "$status" in
            COMPLIANT)
              headline="THE DUEL CONTINUES"
              detail="2 branches · master + development"
              accent="#36d399"
              glow="#36d399"
              scene_markup='
                <g class="duel">
                  <path d="M13 72 Q48 83 83 72" fill="none" stroke="#64748b" stroke-width="1.5"/>
                  <path d="M24 70 L29 52 L36 48 L43 56 L45 72 Z" fill="#cbd5e1" stroke="#f8fafc" stroke-width="1"/>
                  <path d="M31 49 L28 40 L36 35 L43 41 L41 50 Z" fill="#e2e8f0"/>
                  <path d="M59 72 L61 55 L68 48 L76 53 L81 72 Z" fill="#7c879b" stroke="#cbd5e1" stroke-width="1"/>
                  <path d="M61 48 L60 39 L68 34 L76 40 L73 50 Z" fill="#94a3b8"/>
                  <path d="M37 48 L57 29" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
                  <path d="M66 47 L45 28" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
                  <path d="M33 51 L39 57 M63 52 L70 57" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
                  <circle cx="48" cy="29" r="3" fill="#fff" opacity=".9"/>
                </g>'
              ;;
            NON-COMPLIANT)
              headline="THE TRAINING GROUND IS EMPTY"
              detail="$branch_count branches · exactly 2 required"
              accent="#ff4d6d"
              glow="#ff1744"
              scene_markup='
                <g>
                  <ellipse cx="48" cy="68" rx="37" ry="10" fill="#111827" stroke="#ff4d6d" stroke-opacity=".65" stroke-width="1.5"/>
                  <ellipse cx="48" cy="68" rx="25" ry="6" fill="none" stroke="#64748b" stroke-dasharray="2 4" opacity=".65"/>
                  <path d="M15 60 L19 43 L23 60 M73 60 L77 43 L81 60" fill="none" stroke="#64748b" stroke-width="2" opacity=".7"/>
                  <path d="M19 43 L23 43 M77 43 L81 43" stroke="#94a3b8" stroke-width="2"/>
                </g>'
              ;;
            *)
              headline="THE TRAINING GROUND IS VEILED"
              detail="branch inventory unavailable"
              accent="#f5b942"
              glow="#f5b942"
              scene_markup='
                <g opacity=".55">
                  <ellipse cx="48" cy="68" rx="37" ry="10" fill="#111827" stroke="#f5b942" stroke-width="1.5"/>
                  <path d="M12 46 L84 46 M20 39 L20 74 M76 39 L76 74" stroke="#94a3b8" stroke-width="2"/>
                  <path d="M43 37 L53 37 L53 76 L43 76 Z" fill="#64748b"/>
                  <path d="M39 39 L57 39" stroke="#f5b942" stroke-width="3"/>
                </g>'
              ;;
          esac

          evaluated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          branch_json="$(printf '%s\n' "${branches[@]:-}" | jq -R 'select(length > 0)' | jq -s '.')"
          branch_count_json="$(if [[ "$branch_count" == "unknown" ]]; then echo null; else echo "$branch_count"; fi)"
          jq -n \
            --arg repository "$GH_REPO" \
            --arg status "$status" \
            --arg evaluated_at "$evaluated_at" \
            --arg workflow_run "https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID" \
            --arg commit "$GITHUB_SHA" \
            --argjson branch_count "$branch_count_json" \
            --argjson branches "$branch_json" \
            '{
              repository: $repository,
              policy: "exactly-master-and-development",
              required_branches: ["development", "master"],
              actual_branches: $branches,
              branch_count: $branch_count,
              status: $status,
              evaluated_at: $evaluated_at,
              workflow_run: $workflow_run,
              triggering_commit: $commit
            }' > assets/sith-policy.json

          cat > assets/sith-policy.svg <<SVG
          <svg xmlns="http://www.w3.org/2000/svg" width="440" height="104" viewBox="0 0 440 104" role="img" aria-labelledby="title desc">
            <title id="title">Sith Policy: $status</title>
            <desc id="desc">$headline. $detail. When compliant, the Sith Lord and apprentice duel endlessly in the training ground; when in violation, the ground is empty.</desc>
            <defs>
              <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#252b3a"/><stop offset="1" stop-color="#090d17"/>
              </linearGradient>
              <filter id="glow"><feGaussianBlur stdDeviation="3.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>
            <style>
              .arena { transform-origin:48px 61px; animation: breathe 4s ease-in-out infinite; }
              .duel { transform-origin:48px 57px; animation: clash 2.8s ease-in-out infinite alternate; }
              @keyframes breathe { 0%,100% { opacity:.7; } 50% { opacity:1; } }
              @keyframes clash { from { transform:translateX(-2px) rotate(-2deg); } to { transform:translateX(2px) rotate(2deg); } }
              @media (prefers-reduced-motion: reduce) { .arena,.duel { animation:none; } }
            </style>
            <rect x="1" y="1" width="438" height="102" rx="14" fill="url(#metal)" stroke="$accent" stroke-opacity=".8" stroke-width="1.5"/>
            <g class="arena">
              <path d="M7 75 Q48 95 89 75 L89 83 Q48 101 7 83 Z" fill="#0b1020" stroke="$accent" stroke-opacity=".5"/>
              <ellipse cx="48" cy="65" rx="42" ry="23" fill="none" stroke="$accent" stroke-width="1.2" stroke-dasharray="3 4" opacity=".75"/>
              $scene_markup
            </g>
            <text x="108" y="31" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">THE SINGULARITY WORKSHOP</text>
            <text x="108" y="56" fill="$accent" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing=".4">$headline</text>
            <text x="108" y="77" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="11">$detail</text>
            <text x="420" y="94" fill="#64748b" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="8">SITH POLICY · LIVE EVALUATION</text>
          </svg>
          SVG

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          event_deleted="$(jq -r '.deleted // false' "$GITHUB_EVENT_PATH")"
          if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" || "$GITHUB_REF" == "refs/heads/development" || "$GITHUB_EVENT_NAME" == "delete" || "$event_deleted" == "true" ]]; then
            git add assets/sith-policy.svg assets/sith-policy.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: refresh Sith policy evidence"
              git push origin "HEAD:$DEFAULT_BRANCH"
            fi
          else
            echo "Badge publication is reserved for default-branch evaluations."
          fi

          {
            echo "## Sith Policy: $status"
            echo
            printf '%s\n' '- Required branches: `master`, `development`'
            echo "- Actual branch count: $branch_count"
            echo "- Actual branches:"
            if (("${#branches[@]}" == 0)); then
              echo "  - unavailable"
            else
              for item in "${branches[@]}"; do printf '  - `%s`\n' "$item"; done
            fi
            echo "- Evaluated: $evaluated_at"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$status" != "COMPLIANT" ]]; then
            echo "::error::Sith Policy requires exactly master and development; status is $status."
            exit 1
          fi
