<svg xmlns="http://www.w3.org/2000/svg" width="440" height="104" viewBox="0 0 440 104" role="img" aria-labelledby="title desc">
  <title id="title">Sith Policy: NON-COMPLIANT</title>
  <desc id="desc">THE TRAINING GROUND IS EMPTY. 8 branches · exactly 2 required. When compliant, the Sith Lord and apprentice duel endlessly in the training ground; when in violation, the ground is empty.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252b3a"/><stop offset="1" stop-color="#090d17"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .arena { transform-origin:48px 61px; animation: breathe 4s ease-in-out infinite; }
    .duel { transform-origin:48px 57px; animation: clash 2.8s ease-in-out infinite alternate; }
    @keyframes breathe { 0%,100% { opacity:.7; } 50% { opacity:1; } }
    @keyframes clash { from { transform:translateX(-2px) rotate(-2deg); } to { transform:translateX(2px) rotate(2deg); } }
    @media (prefers-reduced-motion: reduce) { .arena,.duel { animation:none; } }
  </style>
  <rect x="1" y="1" width="438" height="102" rx="14" fill="url(#metal)" stroke="#ff4d6d" stroke-opacity=".8" stroke-width="1.5"/>
  <g class="arena">
    <path d="M7 75 Q48 95 89 75 L89 83 Q48 101 7 83 Z" fill="#0b1020" stroke="#ff4d6d" stroke-opacity=".5"/>
    <ellipse cx="48" cy="65" rx="42" ry="23" fill="none" stroke="#ff4d6d" stroke-width="1.2" stroke-dasharray="3 4" opacity=".75"/>
    
      <g>
        <ellipse cx="48" cy="68" rx="37" ry="10" fill="#111827" stroke="#ff4d6d" stroke-opacity=".65" stroke-width="1.5"/>
        <ellipse cx="48" cy="68" rx="25" ry="6" fill="none" stroke="#64748b" stroke-dasharray="2 4" opacity=".65"/>
        <path d="M15 60 L19 43 L23 60 M73 60 L77 43 L81 60" fill="none" stroke="#64748b" stroke-width="2" opacity=".7"/>
        <path d="M19 43 L23 43 M77 43 L81 43" stroke="#94a3b8" stroke-width="2"/>
      </g>
  </g>
  <text x="108" y="31" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">THE SINGULARITY WORKSHOP</text>
  <text x="108" y="56" fill="#ff4d6d" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing=".4">THE TRAINING GROUND IS EMPTY</text>
  <text x="108" y="77" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="11">8 branches · exactly 2 required</text>
  <text x="420" y="94" fill="#64748b" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="8">SITH POLICY · LIVE EVALUATION</text>
</svg>
