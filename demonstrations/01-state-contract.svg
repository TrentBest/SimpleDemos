<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Fox and sheepdog FSM state contract</title>
  <desc id="desc">A source-derived state diagram for the existing C# FSM_API demo. The fox transitions between Walking, Jumping, Fleeing, and Mangled. The sheepdog transitions from Sleeping to Awake to Chasing to Mangling. The dog's Mangling enter callback requests the fox transition to Mangled. This diagram documents code structure; it is not a runtime trace.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9bb3ca"/>
    </marker>
    <marker id="crossArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ffb86c"/>
    </marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#edf4fb}
      .title{font-size:31px;font-weight:800}
      .subtitle{font-size:16px;fill:#b9c9d9}
      .lane{font-size:22px;font-weight:800}
      .state{font-size:18px;font-weight:750}
      .condition{font-size:14px;fill:#c6d5e3}
      .small{font-size:13px;fill:#b9c9d9}
      .fox{fill:#2b3344;stroke:#ffad61;stroke-width:2}
      .dog{fill:#203a3a;stroke:#79dfc0;stroke-width:2}
      .dead{fill:#422b35;stroke:#ff7887;stroke-width:2}
      .edge{fill:none;stroke:#9bb3ca;stroke-width:2.5;marker-end:url(#arrow)}
      .cross{fill:none;stroke:#ffb86c;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#crossArrow)}
    </style>
  </defs>
  <rect width="1200" height="760" rx="22" fill="#0b1421"/>
  <path d="M28 112 H1172" stroke="#2d4155" stroke-width="2"/>
  <text x="48" y="58" class="title">FOX + SHEEPDOG · STATE CONTRACT</text>
  <text x="48" y="87" class="subtitle">Derived from QuickBrownFox/*.cs · TheSingularityWorkshop.FSM_API · source map, not a runtime trace</text>

  <rect x="34" y="136" width="1132" height="250" rx="18" fill="#121f2f" stroke="#31475c"/>
  <text x="58" y="174" class="lane" fill="#ffad61">FOX FSM</text>
  <rect class="fox" x="75" y="216" width="190" height="78" rx="13"/>
  <text class="state" x="170" y="249" text-anchor="middle">Walking</text>
  <text class="condition" x="170" y="273" text-anchor="middle">on update: move</text>
  <rect class="fox" x="365" y="216" width="190" height="78" rx="13"/>
  <text class="state" x="460" y="249" text-anchor="middle">Jumping</text>
  <text class="condition" x="460" y="273" text-anchor="middle">on update: move</text>
  <rect class="fox" x="655" y="216" width="190" height="78" rx="13"/>
  <text class="state" x="750" y="249" text-anchor="middle">Fleeing</text>
  <text class="condition" x="750" y="273" text-anchor="middle">speed increases</text>
  <rect class="dead" x="935" y="216" width="190" height="78" rx="13"/>
  <text class="state" x="1030" y="249" text-anchor="middle">Mangled</text>
  <text class="condition" x="1030" y="273" text-anchor="middle">requested by dog FSM</text>
  <path class="edge" d="M265 238 H357"/>
  <text class="condition" x="311" y="207" text-anchor="middle">ShouldJump</text>
  <path class="edge" d="M365 279 H273"/>
  <text class="condition" x="319" y="321" text-anchor="middle">ShouldLand</text>
  <path class="edge" d="M265 291 C380 363 585 363 655 291"/>
  <text class="condition" x="467" y="359" text-anchor="middle">ShouldFlee (collision)</text>

  <rect x="34" y="410" width="1132" height="232" rx="18" fill="#121f2f" stroke="#31475c"/>
  <text x="58" y="448" class="lane" fill="#79dfc0">SHEEPDOG FSM</text>
  <rect class="dog" x="75" y="490" width="190" height="78" rx="13"/>
  <text class="state" x="170" y="523" text-anchor="middle">Sleeping</text>
  <text class="condition" x="170" y="547" text-anchor="middle">waiting for collision</text>
  <rect class="dog" x="365" y="490" width="190" height="78" rx="13"/>
  <text class="state" x="460" y="523" text-anchor="middle">Awake</text>
  <text class="condition" x="460" y="547" text-anchor="middle">reacts to fox</text>
  <rect class="dog" x="655" y="490" width="190" height="78" rx="13"/>
  <text class="state" x="750" y="523" text-anchor="middle">Chasing</text>
  <text class="condition" x="750" y="547" text-anchor="middle">speed = 3</text>
  <rect class="dog" x="935" y="490" width="190" height="78" rx="13"/>
  <text class="state" x="1030" y="523" text-anchor="middle">Mangling</text>
  <text class="condition" x="1030" y="547" text-anchor="middle">on enter: request fox</text>
  <path class="edge" d="M265 529 H357"/>
  <text class="condition" x="311" y="480" text-anchor="middle">IsAwake</text>
  <path class="edge" d="M555 529 H647"/>
  <text class="condition" x="601" y="480" text-anchor="middle">ShouldChase</text>
  <path class="edge" d="M845 529 H927"/>
  <text class="condition" x="886" y="480" text-anchor="middle">IsMangling</text>

  <path class="cross" d="M1030 490 C1155 405 1145 332 1125 294"/>
  <rect x="42" y="665" width="1116" height="61" rx="12" fill="#2a2530" stroke="#805b42"/>
  <text x="60" y="689" font-size="15" font-weight="800" fill="#ffb86c">EVIDENCE STATUS</text>
  <text x="60" y="710" class="small">This SVG documents states and transitions found in the C# source. It does not execute FSM_API, measure ticks, or prove the browser animation is runtime-driven.</text>
</svg>